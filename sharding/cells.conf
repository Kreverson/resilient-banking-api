# Arquivo gerado por generate-nginx.sh
worker_processes auto;
events { worker_connections 8192; }

http {
    access_log off;

    map $uri $partner {
        ~^/v1/partners/(?<id>[^/]+)/ $id;
        default "";
    }

    split_clients "${partner}" $cell {
        25% cell1;
        25% cell2;
        25% cell3;
        *   cell4;
    }

    upstream cell1 {
        server node1:8080 max_fails=1 fail_timeout=30s;
        server node2:8080 max_fails=1 fail_timeout=30s;
    }

    upstream cell2 {
        server node3:8080 max_fails=1 fail_timeout=30s;
        server node4:8080 max_fails=1 fail_timeout=30s;
    }

    upstream cell3 {
        server node5:8080 max_fails=1 fail_timeout=30s;
        server node6:8080 max_fails=1 fail_timeout=30s;
    }

    upstream cell4 {
        server node7:8080 max_fails=1 fail_timeout=30s;
        server node8:8080 max_fails=1 fail_timeout=30s;
    }

    server {
        listen 80;

        location /v1/partners/ {
            proxy_pass http://$cell;
            # POST tambem e repetido no proximo no quando a conexao falha (o no caiu antes de responder).
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            add_header X-Upstream $upstream_addr always;
        }

        location /gateway/health {
            return 200 "ok";
        }
    }
}
