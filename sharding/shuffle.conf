# Arquivo gerado por generate-nginx.sh
worker_processes auto;
events { worker_connections 8192; }

http {
    access_log off;

    map $uri $partner {
        ~^/v1/partners/(?<id>[^/]+)/ $id;
        default "";
    }

    split_clients "${partner}" $shard {
        3.57% shard_1_2;
        3.57% shard_1_3;
        3.57% shard_1_4;
        3.57% shard_1_5;
        3.57% shard_1_6;
        3.57% shard_1_7;
        3.57% shard_1_8;
        3.57% shard_2_3;
        3.57% shard_2_4;
        3.57% shard_2_5;
        3.57% shard_2_6;
        3.57% shard_2_7;
        3.57% shard_2_8;
        3.57% shard_3_4;
        3.57% shard_3_5;
        3.57% shard_3_6;
        3.57% shard_3_7;
        3.57% shard_3_8;
        3.57% shard_4_5;
        3.57% shard_4_6;
        3.57% shard_4_7;
        3.57% shard_4_8;
        3.57% shard_5_6;
        3.57% shard_5_7;
        3.57% shard_5_8;
        3.57% shard_6_7;
        3.57% shard_6_8;
        *     shard_7_8;
    }

    upstream shard_1_2 {
        server node1:8080 max_fails=1 fail_timeout=30s;
        server node2:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_1_3 {
        server node1:8080 max_fails=1 fail_timeout=30s;
        server node3:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_1_4 {
        server node1:8080 max_fails=1 fail_timeout=30s;
        server node4:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_1_5 {
        server node1:8080 max_fails=1 fail_timeout=30s;
        server node5:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_1_6 {
        server node1:8080 max_fails=1 fail_timeout=30s;
        server node6:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_1_7 {
        server node1:8080 max_fails=1 fail_timeout=30s;
        server node7:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_1_8 {
        server node1:8080 max_fails=1 fail_timeout=30s;
        server node8:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_2_3 {
        server node2:8080 max_fails=1 fail_timeout=30s;
        server node3:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_2_4 {
        server node2:8080 max_fails=1 fail_timeout=30s;
        server node4:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_2_5 {
        server node2:8080 max_fails=1 fail_timeout=30s;
        server node5:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_2_6 {
        server node2:8080 max_fails=1 fail_timeout=30s;
        server node6:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_2_7 {
        server node2:8080 max_fails=1 fail_timeout=30s;
        server node7:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_2_8 {
        server node2:8080 max_fails=1 fail_timeout=30s;
        server node8:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_3_4 {
        server node3:8080 max_fails=1 fail_timeout=30s;
        server node4:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_3_5 {
        server node3:8080 max_fails=1 fail_timeout=30s;
        server node5:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_3_6 {
        server node3:8080 max_fails=1 fail_timeout=30s;
        server node6:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_3_7 {
        server node3:8080 max_fails=1 fail_timeout=30s;
        server node7:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_3_8 {
        server node3:8080 max_fails=1 fail_timeout=30s;
        server node8:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_4_5 {
        server node4:8080 max_fails=1 fail_timeout=30s;
        server node5:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_4_6 {
        server node4:8080 max_fails=1 fail_timeout=30s;
        server node6:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_4_7 {
        server node4:8080 max_fails=1 fail_timeout=30s;
        server node7:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_4_8 {
        server node4:8080 max_fails=1 fail_timeout=30s;
        server node8:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_5_6 {
        server node5:8080 max_fails=1 fail_timeout=30s;
        server node6:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_5_7 {
        server node5:8080 max_fails=1 fail_timeout=30s;
        server node7:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_5_8 {
        server node5:8080 max_fails=1 fail_timeout=30s;
        server node8:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_6_7 {
        server node6:8080 max_fails=1 fail_timeout=30s;
        server node7:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_6_8 {
        server node6:8080 max_fails=1 fail_timeout=30s;
        server node8:8080 max_fails=1 fail_timeout=30s;
    }

    upstream shard_7_8 {
        server node7:8080 max_fails=1 fail_timeout=30s;
        server node8:8080 max_fails=1 fail_timeout=30s;
    }

    server {
        listen 80;

        location /v1/partners/ {
            proxy_pass http://$shard;
            # POST tambem e repetido no proximo no quando a conexao falha (o no caiu antes de responder).
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            add_header X-Upstream $upstream_addr always;
        }

        location /gateway/health {
            return 200 "ok";
        }
    }
}
