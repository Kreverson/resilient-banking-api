global:
  # Intervalo curto: o pico dura 30s e queremos ver a curva segundo a segundo.
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: resilient-banking-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["node1:8080", "node2:8080", "node3:8080", "node4:8080",
                  "node5:8080", "node6:8080", "node7:8080", "node8:8080"]
